<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hand Motion Capture | Shou Bu Dong Zuo Bu Zhuo</title>
    <meta
      name="description"
      content="Standalone bilingual hand motion capture with #33B1FF skeleton lines."
    />
    <style>
      :root {
        --background: #080a0d;
        --foreground: #f4f7fb;
        --muted: #9ca6b5;
        --panel: #11151b;
        --panel-strong: #171d25;
        --accent: #33b1ff;
        --warm: #ffcb74;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--background);
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button {
        border: 0;
        font: inherit;
      }

      .capture-page {
        min-height: 100vh;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255, 203, 116, 0.08), transparent 34%),
          radial-gradient(
            circle at 20% 0%,
            rgba(51, 177, 255, 0.16),
            transparent 28%
          ),
          var(--background);
      }

      .capture-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 18px;
        margin: 0 auto;
        max-width: 1260px;
        min-height: calc(100vh - 48px);
      }

      .capture-main,
      .capture-side {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(17, 21, 27, 0.86);
        box-shadow: 0 18px 56px rgba(0, 0, 0, 0.26);
      }

      .capture-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        border-radius: 8px;
      }

      .capture-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .capture-title {
        min-width: 0;
      }

      .capture-title h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 760;
        line-height: 1.1;
      }

      .capture-title p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .top-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .mode-toggle,
      .language-toggle,
      .tracking-toggle {
        display: inline-grid;
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: #0a0d12;
      }

      .mode-toggle {
        grid-template-columns: repeat(2, minmax(82px, 1fr));
      }

      .language-toggle {
        grid-template-columns: repeat(2, 46px);
      }

      .tracking-toggle {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .mode-toggle button,
      .language-toggle button,
      .tracking-toggle button {
        min-height: 38px;
        border-radius: 6px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }

      .mode-toggle button[aria-pressed="true"],
      .language-toggle button[aria-pressed="true"],
      .tracking-toggle button[aria-pressed="true"] {
        color: #03121f;
        background: var(--accent);
        font-weight: 720;
      }

      .capture-stage {
        position: relative;
        display: grid;
        flex: 1;
        min-height: 420px;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          #05070a;
        background-size: 42px 42px;
      }

      .capture-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .camera-video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .stage-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .stage-empty span {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid rgba(51, 177, 255, 0.4);
        border-radius: 8px;
        color: #d7eefc;
        background: rgba(5, 7, 10, 0.78);
      }

      .capture-side {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 16px;
        border-radius: 8px;
      }

      .control-stack {
        display: grid;
        gap: 10px;
      }

      .glove-controls {
        display: grid;
        gap: 10px;
      }

      .glove-controls[hidden] {
        display: none;
      }

      .control-label {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .glove-help {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .calibration-actions {
        display: flex;
        gap: 8px;
      }

      .calibration-actions button {
        min-height: 38px;
        font-size: 13px;
      }

      .capture-stage[data-calibrating="true"] {
        cursor: crosshair;
      }

      .calibration-notice {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 10px 12px;
        border: 1px solid rgba(51, 177, 255, 0.45);
        border-radius: 8px;
        background: rgba(5, 7, 10, 0.88);
        color: #d7eefc;
        font-size: 13px;
        pointer-events: none;
      }

      .primary-action,
      .secondary-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 46px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 160ms ease,
          background 160ms ease,
          color 160ms ease,
          border-color 160ms ease;
      }

      .primary-action {
        color: #04131d;
        background: var(--accent);
        font-weight: 780;
      }

      .secondary-action {
        color: var(--foreground);
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: var(--panel-strong);
      }

      .primary-action:hover,
      .secondary-action:hover {
        transform: translateY(-1px);
      }

      .primary-action:disabled,
      .secondary-action:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      .button-icon {
        position: relative;
        display: inline-block;
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
      }

      .play-icon::before {
        content: "";
        position: absolute;
        inset: 2px 3px;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 9px solid currentColor;
      }

      .stop-icon::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 2px;
        background: currentColor;
      }

      .download-icon::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 2px;
        width: 2px;
        height: 8px;
        background: currentColor;
      }

      .download-icon::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 8px;
        width: 8px;
        height: 8px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .status-list {
        display: grid;
        gap: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 48px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .status-row span:first-child {
        color: var(--muted);
      }

      .status-row strong {
        color: var(--foreground);
        font-weight: 720;
        text-align: right;
      }

      .color-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .color-chip::before {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--accent);
        box-shadow: 0 0 24px rgba(51, 177, 255, 0.7);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .status-pill::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warm);
        box-shadow: 0 0 16px rgba(255, 203, 116, 0.52);
      }

      .status-pill[data-active="true"]::before {
        background: #5df2a0;
        box-shadow: 0 0 16px rgba(93, 242, 160, 0.54);
      }

      .status-pill[data-error="true"]::before {
        background: var(--danger);
        box-shadow: 0 0 16px rgba(255, 107, 107, 0.54);
      }

      .capture-footnote {
        margin-top: auto;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 920px) {
        .capture-page {
          padding: 12px;
        }

        .capture-shell {
          grid-template-columns: 1fr;
          min-height: calc(100vh - 24px);
        }

        .capture-side {
          order: -1;
        }

        .capture-stage {
          min-height: 58vh;
        }
      }

      @media (max-width: 620px) {
        .capture-topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .mode-toggle,
        .language-toggle {
          width: 100%;
        }

        .language-toggle {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .capture-title h1 {
          font-size: 22px;
        }

        .capture-stage {
          min-height: 54vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="capture-page">
      <div class="capture-shell">
        <section class="capture-main" id="capture-main">
          <header class="capture-topbar">
            <div class="capture-title">
              <h1 id="title"></h1>
              <p id="subtitle"></p>
            </div>
            <div class="top-actions">
              <div class="mode-toggle" id="mode-toggle">
                <button type="button" data-mode="camera" aria-pressed="true"></button>
                <button type="button" data-mode="lines" aria-pressed="false"></button>
              </div>
              <div class="language-toggle" id="language-toggle">
                <button type="button" data-language="zh" aria-pressed="true" title="Chinese">
                  &#20013;
                </button>
                <button type="button" data-language="en" aria-pressed="false" title="English">
                  EN
                </button>
              </div>
            </div>
          </header>

          <div class="capture-stage" id="stage">
            <canvas class="capture-canvas" id="canvas"></canvas>
            <video class="camera-video" id="video" playsinline muted></video>
            <div class="calibration-notice" id="calibration-notice" role="status" hidden></div>
            <div class="stage-empty" id="stage-empty" aria-hidden="true">
              <span id="stage-label"></span>
            </div>
          </div>
        </section>

        <aside class="capture-side" id="capture-side">
          <div class="control-stack">
            <p class="control-label" id="tracking-label"></p>
            <div class="tracking-toggle" id="tracking-toggle">
              <button type="button" data-tracking="glove" aria-pressed="true"></button>
              <button type="button" data-tracking="bare" aria-pressed="false"></button>
            </div>
          </div>
          <div class="control-stack">
            <button type="button" class="primary-action" id="capture-button" disabled>
              <span class="button-icon play-icon" aria-hidden="true"></span>
              <span id="capture-button-label"></span>
            </button>
            <button type="button" class="secondary-action" id="save-button" disabled>
              <span class="button-icon download-icon" aria-hidden="true"></span>
              <span id="save-button-label"></span>
            </button>
          </div>

          <div class="glove-controls" id="glove-controls">
            <div class="calibration-actions">
              <button type="button" class="secondary-action" id="calibrate-button" disabled></button>
              <button type="button" class="secondary-action" id="reset-calibration-button" disabled></button>
            </div>
            <p class="glove-help" id="glove-help"></p>
          </div>

          <div class="status-list" aria-live="polite">
            <div class="status-row">
              <span id="status-label"></span>
              <strong class="status-pill" id="status-value"></strong>
            </div>
            <div class="status-row">
              <span id="hands-label"></span>
              <strong id="hands-value">0</strong>
            </div>
            <div class="status-row">
              <span id="confidence-label"></span>
              <strong id="confidence-value">--</strong>
            </div>
            <div class="status-row">
              <span id="line-label"></span>
              <strong class="color-chip">#33B1FF</strong>
            </div>
          </div>

          <p class="capture-footnote" id="footnote"></p>
        </aside>
      </div>
    </main>

      function getInitialLanguage() {
        const saved = window.localStorage.getItem("hand-capture-language");
        if (saved === "zh" || saved === "en") return saved;
        return window.navigator.language.toLowerCase().startsWith("zh")
          ? "zh"
          : "en";
      }

      function loadHandsScript() {
        return new Promise((resolve, reject) => {
          if (window.Hands) {
            resolve();
            return;
          }

          const script = document.createElement("script");
          script.src = HANDS_SCRIPT;
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("hands-load"));
          document.head.appendChild(script);
        });
      }

      const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
      const emptyResults = () => ({ multiHandLandmarks: [], multiHandedness: [] });

      function detectorOptions(recovery = false) {
        const glove = state.trackingMode === "glove";
        return {
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: glove ? (recovery ? 0.3 : 0.4) : 0.6,
          minTrackingConfidence: glove ? 0.4 : 0.6,
          selfieMode: false,
        };
      }

      function createDetector(recovery = false) {
        const detector = new window.Hands({ locateFile: (file) => `${HANDS_ASSETS}${file}` });
        detector.setOptions(detectorOptions(recovery));
        detector.onResults((results) => state.detectorResults.set(detector, results));
        return detector;
      }

      async function detect(detector, image, reset = false) {
        if (reset) await detector.reset();
        state.detectorResults.set(detector, null);
        await detector.send({ image });
        return state.detectorResults.get(detector) || emptyResults();
      }

      function colorComponents(r, g, b) {
        return {
          y: 0.299 * r + 0.587 * g + 0.114 * b,
          cb: -0.168736 * r - 0.331264 * g + 0.5 * b,
          cr: 0.5 * r - 0.418688 * g - 0.081312 * b,
        };
      }

      function matchingProfile(r, g, b) {
        if (!state.colorProfiles.length) return undefined;
        const color = colorComponents(r, g, b);
        return state.colorProfiles.find((profile) =>
          Math.abs(color.y - profile.y) <= profile.yTolerance &&
          Math.hypot(color.cb - profile.cb, color.cr - profile.cr) <= profile.chromaTolerance,
        );
      }

      function captureInputFrame() {
        const scale = Math.min(1, 960 / refs.video.videoWidth);
        const width = Math.round(refs.video.videoWidth * scale);
        const height = Math.round(refs.video.videoHeight * scale);
        if (state.frameCanvas.width !== width || state.frameCanvas.height !== height) {
          state.frameCanvas.width = width;
          state.frameCanvas.height = height;
        }
        state.frameCanvas.getContext("2d", { willReadFrequently: true })
          .drawImage(refs.video, 0, 0, width, height);
      }

      function enhanceFrame(variant = "contrast") {
        const source = state.frameCanvas;
        const output = state.enhancedCanvas;
        if (output.width !== source.width || output.height !== source.height) {
          output.width = source.width;
          output.height = source.height;
        }
        const context = output.getContext("2d", { willReadFrequently: true });
        context.drawImage(source, 0, 0);
        const image = context.getImageData(0, 0, output.width, output.height);
        const pixels = image.data;
        const histogram = new Uint32Array(256);
        for (let i = 0; i < pixels.length; i += 16) {
          histogram[Math.round(0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2])]++;
        }
        const sampleCount = Math.ceil(pixels.length / 16);
        let low = 0, high = 255, total = 0;
        for (let i = 0; i < 256; i++) {
          total += histogram[i];
          if (total < sampleCount * 0.02) low = i;
          if (total < sampleCount * 0.98) high = i;
        }
        const range = Math.max(80, high - low);
        for (let i = 0; i < pixels.length; i += 4) {
          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
          const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
          const adjusted = 255 * Math.pow(clamp((luminance - low) / range), 0.78);
          const profile = matchingProfile(r, g, b);
          if (profile) {
            // Preserve measured shading and silhouette; only the detector sees this color adaptation.
            const shade = clamp(145 + (luminance - profile.y) * 1.6, 45, 215);
            pixels[i] = shade + 35;
            pixels[i + 1] = shade + 10;
            pixels[i + 2] = shade - 15;
          } else if (variant === "warm" && !state.colorProfiles.length) {
            pixels[i] = clamp(adjusted * 1.08 + 18, 0, 255);
            pixels[i + 1] = clamp(adjusted * 0.91 + 8, 0, 255);
            pixels[i + 2] = clamp(adjusted * 0.78 + 3, 0, 255);
          } else {
            const offset = (adjusted - luminance) * 0.75;
            pixels[i] = clamp(r + offset, 0, 255);
            pixels[i + 1] = clamp(g + offset, 0, 255);
            pixels[i + 2] = clamp(b + offset, 0, 255);
          }
        }
        context.putImageData(image, 0, 0);
        return output;
      }

      function paddedRegion(region, margin = 0.35) {
        const minX = clamp(region.x - region.width * margin);
        const minY = clamp(region.y - region.height * margin);
        const maxX = clamp(region.x + region.width * (1 + margin));
        const maxY = clamp(region.y + region.height * (1 + margin));
        return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
      }

      function landmarkRegion(landmarks, margin = 0.45) {
        const xs = landmarks.map((point) => point.x);
        const ys = landmarks.map((point) => point.y);
        return paddedRegion({
          x: Math.min(...xs), y: Math.min(...ys),
          width: Math.max(0.08, Math.max(...xs) - Math.min(...xs)),
          height: Math.max(0.08, Math.max(...ys) - Math.min(...ys)),
        }, margin);
      }

      function cropFrame(source, region) {
        const width = Math.max(1, source.width * region.width);
        const height = Math.max(1, source.height * region.height);
        const scale = Math.min(2, 640 / Math.max(width, height));
        const output = state.cropCanvas;
        output.width = Math.max(1, Math.round(width * scale));
        output.height = Math.max(1, Math.round(height * scale));
        output.getContext("2d").drawImage(source,
          source.width * region.x, source.height * region.y, width, height,
          0, 0, output.width, output.height,
        );
        return output;
      }

      function validLandmarks(landmarks) {
        if (!landmarks || landmarks.length !== 21) return false;
        if (landmarks.some((p) => !Number.isFinite(p.x) || !Number.isFinite(p.y) ||
          !Number.isFinite(p.z) || p.x < -0.2 || p.x > 1.2 || p.y < -0.2 || p.y > 1.2)) return false;
        const palmSize = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        return palmSize > 0.015 && palmSize < 0.8;
      }

      function candidatesFor(results, region = null) {
        return (results.multiHandLandmarks || []).flatMap((landmarks, index) => {
          if (!validLandmarks(landmarks)) return [];
          const mapped = landmarks.map((point) => ({
            x: region ? region.x + point.x * region.width : point.x,
            y: region ? region.y + point.y * region.height : point.y,
            z: region ? point.z * region.width : point.z,
          }));
          if (!validLandmarks(mapped)) return [];
          return [{ landmarks: mapped, handedness: results.multiHandedness?.[index] || null }];
        });
      }

      function palmDistance(a, b) {
        return [0, 5, 9, 13, 17].reduce((sum, index) =>
          sum + Math.hypot(a[index].x - b[index].x, a[index].y - b[index].y), 0) / 5;
      }

      function mergeCandidates(current, additions) {
        const merged = [...current];
        for (const candidate of additions) {
          const duplicate = merged.some((other) => {
            const span = Math.hypot(other.landmarks[5].x - other.landmarks[17].x,
              other.landmarks[5].y - other.landmarks[17].y);
            return palmDistance(candidate.landmarks, other.landmarks) < Math.max(0.035, span * 0.55);
          });
          if (!duplicate && merged.length < 2) merged.push(candidate);
        }
        return merged;
      }

      function colorRegions() {
        if (!state.colorProfiles.length) return [];
        const source = state.frameCanvas;
        const pixels = source.getContext("2d", { willReadFrequently: true })
          .getImageData(0, 0, source.width, source.height).data;
        const step = 6;
        const width = Math.ceil(source.width / step), height = Math.ceil(source.height / step);
        const mask = new Uint8Array(width * height);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const i = (Math.min(y * step, source.height - 1) * source.width + Math.min(x * step, source.width - 1)) * 4;
            mask[y * width + x] = matchingProfile(pixels[i], pixels[i + 1], pixels[i + 2]) ? 1 : 0;
          }
        }
        const regions = [];
        for (let start = 0; start < mask.length; start++) {
          if (mask[start] !== 1) continue;
          const queue = [start];
          mask[start] = 2;
          let minX = width, minY = height, maxX = 0, maxY = 0;
          for (let head = 0; head < queue.length; head++) {
            const index = queue[head], x = index % width, y = Math.floor(index / width);
            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            const neighbors = [];
            if (x > 0) neighbors.push(index - 1);
            if (x + 1 < width) neighbors.push(index + 1);
            if (y > 0) neighbors.push(index - width);
            if (y + 1 < height) neighbors.push(index + width);
            for (const neighbor of neighbors) {
              if (mask[neighbor] === 1) { mask[neighbor] = 2; queue.push(neighbor); }
            }
          }
          // Large areas of matching background must not become a pretend hand.
          if (queue.length < 30 || queue.length > mask.length * 0.5 || maxX - minX < 4 || maxY - minY < 4) continue;
          regions.push({ ...paddedRegion({
            x: minX / width, y: minY / height,
            width: (maxX - minX + 1) / width, height: (maxY - minY + 1) / height,
          }), area: queue.length });
        }
        return regions.sort((a, b) => b.area - a.area).slice(0, 3);
      }

      function stabilizeCandidates(candidates, now) {
        const oldTracks = state.tracks.filter((track) => now - track.seenAt < 750);
        const used = new Set();
        const fresh = candidates.map((candidate) => {
          let match = -1, best = 0.18;
          oldTracks.forEach((track, index) => {
            if (used.has(index)) return;
            const distance = palmDistance(candidate.landmarks, track.landmarks);
            if (distance < best) { match = index; best = distance; }
          });
          let landmarks = candidate.landmarks;
          if (match >= 0) used.add(match);
          if (match >= 0 && now - oldTracks[match].seenAt < 200) {
            const alpha = clamp(0.55 + best * 4, 0.55, 0.95);
            landmarks = landmarks.map((point, index) => ({
              x: point.x * alpha + oldTracks[match].landmarks[index].x * (1 - alpha),
              y: point.y * alpha + oldTracks[match].landmarks[index].y * (1 - alpha),
              z: point.z * alpha + oldTracks[match].landmarks[index].z * (1 - alpha),
            }));
          }
          return { ...candidate, landmarks, seenAt: now };
        });
        state.tracks = [...fresh, ...oldTracks.filter((_, index) => !used.has(index))].slice(0, 4);
        // Only observations from this frame are displayed. Previous tracks are used for recovery, never as new measurements.
        return fresh;
      }

      async function processFrame(session) {
        const version = state.settingsVersion;
        const isCurrent = () => state.isRunning && session === state.session && version === state.settingsVersion;
        captureInputFrame();
        if (state.needsReset) {
          state.hands.setOptions(detectorOptions());
          await state.hands.reset();
          if (!isCurrent()) return;
          state.needsReset = false;
        }
        if (!isCurrent()) return;
        const glove = state.trackingMode === "glove";
        const source = glove && state.primaryVariant !== "raw"
          ? enhanceFrame(state.primaryVariant) : state.frameCanvas;
        const region = glove ? state.activeRegion : null;
        const mainImage = region ? cropFrame(source, region) : source;
        let candidates = candidatesFor(await detect(state.hands, mainImage), region);
        if (!isCurrent()) return;
        const mainCount = candidates.length;
        if (glove && candidates.length < 2) {
          if (!state.recoveryHands) state.recoveryHands = createDetector(true);
          // Both paths run on the SAME frame so a bare hand and a gloved hand can be tracked together.
          const variant = state.primaryVariant === "raw" ? state.assistVariant : "raw";
          const recoverySource = variant === "raw" ? state.frameCanvas : enhanceFrame(variant);
          const inputKey = `full:${variant}`;
          const reset = state.needsRecoveryReset || state.recoveryInputKey !== inputKey;
          const recovered = candidatesFor(await detect(state.recoveryHands, recoverySource, reset));
          if (!isCurrent()) return;
          state.recoveryInputKey = inputKey;
          state.needsRecoveryReset = false;
          candidates = mergeCandidates(candidates, recovered);
          if (recovered.length === 2 && recovered.length > mainCount) {
            state.primaryVariant = variant;
            state.activeRegion = null;
            state.needsReset = true;
          }
          if (candidates.length < 2 && performance.now() - state.lastRecovery > 240) {
            state.recoveryIndex++;
            if (!candidates.length && !state.colorProfiles.length &&
              state.primaryVariant !== "warm" && variant !== "warm") {
              const warm = candidatesFor(await detect(state.recoveryHands, enhanceFrame("warm"), true));
              if (!isCurrent()) return;
              state.recoveryInputKey = "full:warm";
              candidates = mergeCandidates(candidates, warm);
              if (warm.length) state.assistVariant = "warm";
            }
            const regions = [
              ...state.tracks.filter((track) => performance.now() - track.seenAt < 750)
                .map((track) => landmarkRegion(track.landmarks)),
              ...colorRegions(),
              ...(state.focusRegion ? [state.focusRegion] : []),
            ].filter((roi) => roi.width > 0.05 && roi.height > 0.05 && !candidates.some((candidate) => {
              const wrist = candidate.landmarks[0];
              return wrist.x > roi.x && wrist.x < roi.x + roi.width && wrist.y > roi.y && wrist.y < roi.y + roi.height;
            }));
            if (regions.length) {
              const roi = regions[(state.recoveryIndex - 1) % regions.length];
              const cropSource = enhanceFrame(state.colorProfiles.length ? "contrast" : "warm");
              const cropped = candidatesFor(await detect(state.recoveryHands, cropFrame(cropSource, roi), true), roi);
              if (!isCurrent()) return;
              state.recoveryInputKey = "crop";
              candidates = mergeCandidates(candidates, cropped);
              if (mainCount === 0 && cropped.length) {
                state.primaryVariant = state.colorProfiles.length ? "contrast" : "warm";
                state.activeRegion = landmarkRegion(cropped.flatMap((candidate) => candidate.landmarks), 0.6);
                state.needsReset = true;
              }
            }
            state.lastRecovery = performance.now();
          }
        }
        if (!isCurrent()) return;
        if (state.activeRegion && mainCount > 0) {
          state.activeRegion = landmarkRegion(candidates.flatMap((candidate) => candidate.landmarks), 0.6);
        } else if (state.activeRegion && !candidates.length) {
          state.activeRegion = null;
          state.needsReset = true;
        }
        const stable = stabilizeCandidates(candidates, performance.now());
        handleResults({
          image: state.frameCanvas,
          multiHandLandmarks: stable.map((candidate) => candidate.landmarks),
          multiHandedness: stable.map((candidate) => candidate.handedness).filter(Boolean),
        });
      }

      function resetTracking() {
        state.settingsVersion++;
        state.tracks = [];
        state.activeRegion = null;
        state.primaryVariant = "raw";
        state.assistVariant = "contrast";
        state.needsRecoveryReset = true;
        state.lastRecovery = -Infinity;
        state.recoveryIndex = 0;
        state.needsReset = true;
        state.latestResults = null;
        state.handCount = 0;
        state.confidence = null;
      }

      function setTrackingMode(mode) {
        if (mode !== "glove" && mode !== "bare") return;
        state.trackingMode = mode;
        state.calibrating = false;
        state.calibrationMessage = false;
        resetTracking();
        if (state.isRunning) state.statusKey = "seekingHand";
        render();
      }

      function beginCalibration() {
        if (!state.isRunning || !state.latestResults || state.trackingMode !== "glove") return;
        state.calibrating = !state.calibrating;
        state.calibrationMessage = false;
        if (state.calibrating) state.viewMode = "camera";
        render();
        drawResults(state.latestResults);
      }

      function calibrateAtPoint(event) {
        if (!state.calibrating || !state.isRunning || !state.latestResults) return;
        const rect = refs.canvas.getBoundingClientRect();
        const transform = getCoverTransform(refs.canvas.width, refs.canvas.height,
          refs.video.videoWidth, refs.video.videoHeight);
        const px = (event.clientX - rect.left) * refs.canvas.width / rect.width;
        const py = (event.clientY - rect.top) * refs.canvas.height / rect.height;
        const x = 1 - (px - transform.x) / transform.width;
        const y = (py - transform.y) / transform.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) return;
        const source = state.frameCanvas;
        const sampleX = clamp(Math.round(x * source.width) - 5, 0, source.width - 11);
        const sampleY = clamp(Math.round(y * source.height) - 5, 0, source.height - 11);
        const pixels = source.getContext("2d", { willReadFrequently: true }).getImageData(sampleX, sampleY, 11, 11).data;
        const ys = [], cbs = [], crs = [];
        for (let i = 0; i < pixels.length; i += 4) {
          const color = colorComponents(pixels[i], pixels[i + 1], pixels[i + 2]);
          ys.push(color.y); cbs.push(color.cb); crs.push(color.cr);
        }
        for (const values of [ys, cbs, crs]) values.sort((a, b) => a - b);
        const median = (values) => values[Math.floor(values.length / 2)];
        const profile = {
          y: median(ys), cb: median(cbs), cr: median(crs),
          yTolerance: Math.max(40, (ys[90] - ys[30]) * 2.5), chromaTolerance: 24,
        };
        state.colorProfiles.push(profile);
        state.colorProfiles = state.colorProfiles.slice(-2);
        state.focusRegion = paddedRegion({ x: x - 0.2, y: y - 0.3, width: 0.4, height: 0.6 }, 0.15);
        state.calibrating = false;
        state.calibrationMessage = true;
        resetTracking();
        state.statusKey = "seekingHand";
        render();
      }

      function resizeCanvas() {
        const rect = refs.stage.getBoundingClientRect();
        const pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const width = Math.max(1, Math.round(rect.width * pixelRatio));
        const height = Math.max(1, Math.round(rect.height * pixelRatio));

        if (refs.canvas.width !== width || refs.canvas.height !== height) {
          refs.canvas.width = width;
          refs.canvas.height = height;
        }

        return { width, height };
      }

      function getCoverTransform(canvasWidth, canvasHeight, videoWidth, videoHeight) {
        const scale = Math.max(canvasWidth / videoWidth, canvasHeight / videoHeight);
        const width = videoWidth * scale;
        const height = videoHeight * scale;
        return {
          x: (canvasWidth - width) / 2,
          y: (canvasHeight - height) / 2,
          width,
          height,
        };
      }

      function drawLineBackdrop(context, width, height) {
        context.fillStyle = "#05070a";
        context.fillRect(0, 0, width, height);
        context.strokeStyle = "rgba(51, 177, 255, 0.08)";
        context.lineWidth = 1;

        const gridSize = Math.max(36, width / 18);
        for (let x = 0; x <= width; x += gridSize) {
          context.beginPath();
          context.moveTo(x, 0);
          context.lineTo(x, height);
          context.stroke();
        }

        for (let y = 0; y <= height; y += gridSize) {
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(width, y);
          context.stroke();
        }
      }

      function drawIdleFrame() {
        const context = refs.canvas.getContext("2d");
        const { width, height } = resizeCanvas();
        drawLineBackdrop(context, width, height);

        context.save();
        context.strokeStyle = LINE_COLOR;
        context.lineWidth = 6;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.shadowColor = "rgba(51, 177, 255, 0.65)";
        context.shadowBlur = 18;

        const centerX = width * 0.5;
        const centerY = height * 0.56;
        const scale = Math.min(width, height) / 620;
        const demoPoints = [
          [centerX - 110 * scale, centerY + 84 * scale],
          [centerX - 78 * scale, centerY - 30 * scale],
          [centerX - 42 * scale, centerY - 148 * scale],
          [centerX + 0 * scale, centerY - 68 * scale],
          [centerX + 42 * scale, centerY - 174 * scale],
          [centerX + 62 * scale, centerY - 48 * scale],
          [centerX + 130 * scale, centerY - 134 * scale],
          [centerX + 98 * scale, centerY - 12 * scale],
          [centerX + 174 * scale, centerY - 54 * scale],
        ];

        context.beginPath();
        context.moveTo(demoPoints[0][0], demoPoints[0][1]);
        for (const point of demoPoints.slice(1)) {
          context.lineTo(point[0], point[1]);
        }
        context.stroke();
        context.restore();
      }

      function drawVideoFrame(context, transform, canvasWidth) {
        context.save();
        context.translate(canvasWidth, 0);
        context.scale(-1, 1);
        context.drawImage(
          state.latestResults?.image || refs.video,
          canvasWidth - transform.x - transform.width,
          transform.y,
          transform.width,
          transform.height,
        );
        context.restore();
      }

      function pointForLandmark(landmark, transform) {
        return {
          x: transform.x + (1 - landmark.x) * transform.width,
          y: transform.y + landmark.y * transform.height,
        };
      }

      function drawHandSkeleton(context, hands, transform) {
        context.save();
        context.lineCap = "round";
        context.lineJoin = "round";
        context.shadowColor = "rgba(51, 177, 255, 0.7)";
        context.shadowBlur = 18;

        for (const landmarks of hands) {
          context.strokeStyle = LINE_COLOR;
          context.lineWidth = 7;

          for (const [startIndex, endIndex] of HAND_CONNECTIONS) {
            const start = landmarks[startIndex];
            const end = landmarks[endIndex];
            if (!start || !end) continue;

            const startPoint = pointForLandmark(start, transform);
            const endPoint = pointForLandmark(end, transform);
            context.beginPath();
            context.moveTo(startPoint.x, startPoint.y);
            context.lineTo(endPoint.x, endPoint.y);
            context.stroke();
          }

          context.fillStyle = "#c7efff";
          for (const landmark of landmarks) {
            const point = pointForLandmark(landmark, transform);
            context.beginPath();
            context.arc(point.x, point.y, 6, 0, Math.PI * 2);
            context.fill();
          }
        }

        context.restore();
      }

      function drawResults(results) {
        if (!refs.video.videoWidth || !refs.video.videoHeight) return;

        const context = refs.canvas.getContext("2d");
        const { width, height } = resizeCanvas();
        const transform = getCoverTransform(
          width,
          height,
          refs.video.videoWidth,
          refs.video.videoHeight,
        );

        context.clearRect(0, 0, width, height);

        if (state.viewMode === "camera") {
          drawVideoFrame(context, transform, width);
          context.fillStyle = "rgba(3, 7, 12, 0.16)";
          context.fillRect(0, 0, width, height);
        } else {
          drawLineBackdrop(context, width, height);
        }

        const hands = results.multiHandLandmarks || [];
        if (hands.length > 0) {
          drawHandSkeleton(context, hands, transform);
        }
      }

      function handleResults(results) {
        state.latestResults = results;
        const hands = results.multiHandLandmarks || [];
        const handedness = results.multiHandedness || [];
        const scoreTotal = handedness.reduce(
          (total, hand) => total + (hand.score || 0),
          0,
        );

        state.handCount = hands.length;
        state.confidence = handedness.length ? scoreTotal / handedness.length : null;
        state.statusKey = hands.length > 0 ? "capturing" : "seekingHand";
        render();
        drawResults(results);
      }

      async function startCamera() {
        if (!state.hands || state.isRunning || state.isStarting || state.frameBusy) return;

        const session = ++state.session;
        state.isStarting = true;
        resetTracking();
        state.lastVideoTime = -1;
        state.errorKey = null;
        state.statusKey = "startingCamera";
        render();

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: "user",
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },
          });

          if (session !== state.session) {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }

          state.stream = stream;
          refs.video.srcObject = stream;
          await refs.video.play();

          if (session !== state.session) return;

          state.isStarting = false;
          state.isRunning = true;
          state.statusKey = "seekingHand";
          render();

          const loop = async () => {
            if (!state.isRunning || !state.hands || session !== state.session) return;

            if (refs.video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
              refs.video.videoWidth > 0 && refs.video.currentTime !== state.lastVideoTime) {
              if (!state.frameBusy) {
                state.frameBusy = true;
                state.lastVideoTime = refs.video.currentTime;
                try {
                  await processFrame(session);
                } catch (error) {
                  if (session === state.session) {
                    console.error("Hand tracking failed", error);
                    state.errorKey = "recognitionFailed";
                    stopCamera(false);
                    state.statusKey = "moduleUnavailable";
                  }
                } finally {
                  state.frameBusy = false;
                  if (!state.isRunning) render();
                }
              }
            }

            if (state.isRunning && session === state.session) state.raf = requestAnimationFrame(loop);
          };

          stream.getVideoTracks().forEach((track) => track.addEventListener("ended", () => {
            if (session === state.session) stopCamera();
          }));
          state.raf = requestAnimationFrame(loop);
        } catch {
          state.errorKey = "cameraStart";
          state.statusKey = "cameraUnavailable";
          stopCamera(false);
          state.statusKey = "cameraUnavailable";
          render();
        } finally {
          state.isStarting = false;
          render();
        }
      }

      function stopCamera(shouldRender = true) {
        state.session++;
        state.isRunning = false;
        state.calibrating = false;

        if (state.raf !== null) {
          cancelAnimationFrame(state.raf);
          state.raf = null;
        }

        if (state.stream) {
          state.stream.getTracks().forEach((track) => track.stop());
        }

        state.stream = null;
        refs.video.pause();
        refs.video.srcObject = null;
        // An in-flight inference owns frameBusy until it completes, including after stop.
        resetTracking();
        if (!state.errorKey) state.statusKey = "stopped";

        drawIdleFrame();
        if (shouldRender) render();
      }

      function saveFrame() {
        const link = document.createElement("a");
        link.href = refs.canvas.toDataURL("image/png");
        link.download = "hand-motion-capture.png";
        link.click();
      }

      function setLanguage(language) {
        state.language = language;
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        window.localStorage.setItem("hand-capture-language", language);
        render();
      }

      function setViewMode(mode) {
        state.viewMode = mode;
        if (state.latestResults && state.isRunning) {
          drawResults(state.latestResults);
        } else {
          drawIdleFrame();
        }
        render();
      }

      function render() {
        const copy = COPY[state.language];
        refs.title.textContent = copy.title;
        refs.subtitle.textContent = copy.subtitle;
        refs.captureMain.setAttribute("aria-label", copy.captureStage);
        refs.captureSide.setAttribute("aria-label", copy.controls);
        refs.modeToggle.setAttribute("aria-label", copy.displayMode);
        refs.languageToggle.setAttribute("aria-label", copy.language);
        refs.stageLabel.textContent = state.libraryReady
          ? copy.standbyStage
          : copy.loadingStage;

        refs.modeToggle.querySelector('[data-mode="camera"]').textContent =
          copy.cameraMode;
        refs.modeToggle.querySelector('[data-mode="lines"]').textContent =
          copy.linesMode;

        refs.captureButtonLabel.textContent = state.isRunning
          ? copy.stop
          : copy.start;
        refs.captureButton.disabled = !state.libraryReady || state.isStarting || (!state.isRunning && state.frameBusy);
        refs.captureButton.querySelector(".button-icon").className = state.isRunning
          ? "button-icon stop-icon"
          : "button-icon play-icon";
        refs.saveButtonLabel.textContent = copy.saveFrame;
        refs.saveButton.disabled = !state.isRunning || !state.latestResults;

        refs.trackingLabel.textContent = copy.trackingLabel;
        refs.trackingToggle.setAttribute("aria-label", copy.trackingLabel);
        refs.trackingToggle.querySelector('[data-tracking="glove"]').textContent = copy.gloveMode;
        refs.trackingToggle.querySelector('[data-tracking="bare"]').textContent = copy.bareMode;
        for (const button of refs.trackingToggle.querySelectorAll("button")) {
          button.setAttribute("aria-pressed", String(button.dataset.tracking === state.trackingMode));
        }
        refs.gloveControls.hidden = state.trackingMode !== "glove";
        refs.gloveHelp.textContent = state.calibrationMessage ? copy.calibrationDone : copy.gloveHelp;
        refs.calibrateButton.textContent = state.calibrating ? copy.cancelCalibration : copy.calibrate;
        refs.calibrateButton.disabled = !state.isRunning || !state.latestResults;
        refs.resetCalibrationButton.textContent = copy.resetCalibration;
        refs.resetCalibrationButton.disabled = !state.colorProfiles.length && !state.calibrating;
        refs.stage.dataset.calibrating = String(state.calibrating);
        refs.calibrationNotice.hidden = !state.calibrating;
        refs.calibrationNotice.textContent = copy.calibrationNotice;

        refs.statusLabel.textContent = copy.statusLabel;
        refs.statusValue.textContent = state.errorKey
          ? copy.abnormal
          : copy.status[state.statusKey];
        refs.statusValue.dataset.active = String(state.isRunning && !state.errorKey);
        refs.statusValue.dataset.error = String(Boolean(state.errorKey));
        refs.handsLabel.textContent = copy.handsLabel;
        refs.handsValue.textContent = String(state.handCount);
        refs.confidenceLabel.textContent = copy.confidenceLabel;
        refs.confidenceValue.textContent =
          state.confidence === null ? "--" : `${Math.round(state.confidence * 100)}%`;
        refs.lineLabel.textContent = copy.lineLabel;
        refs.footnote.textContent = state.errorKey
          ? copy.errors[state.errorKey]
          : copy.footnote;
        refs.stageEmpty.style.display = state.isRunning ? "none" : "grid";

        for (const button of refs.modeToggle.querySelectorAll("button")) {
          button.setAttribute("aria-pressed", String(button.dataset.mode === state.viewMode));
        }

        for (const button of refs.languageToggle.querySelectorAll("button")) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.language === state.language),
          );
        }
      }

      refs.captureButton.addEventListener("click", () => {
        if (state.isRunning) {
          stopCamera();
        } else {
          startCamera();
        }
      });
      refs.saveButton.addEventListener("click", saveFrame);
      refs.trackingToggle.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-tracking]");
        if (button) setTrackingMode(button.dataset.tracking);
      });
      refs.calibrateButton.addEventListener("click", beginCalibration);
      refs.canvas.addEventListener("click", calibrateAtPoint);
      refs.resetCalibrationButton.addEventListener("click", () => {
        state.colorProfiles = [];
        state.focusRegion = null;
        state.calibrating = false;
        state.calibrationMessage = false;
        resetTracking();
        if (state.isRunning) state.statusKey = "seekingHand";
        render();
      });
      refs.modeToggle.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-mode]");
        if (button) setViewMode(button.dataset.mode);
      });
      refs.languageToggle.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-language]");
        if (button) setLanguage(button.dataset.language);
      });
      window.addEventListener("resize", () => {
        if (state.latestResults && state.isRunning) {
          drawResults(state.latestResults);
        } else {
          drawIdleFrame();
        }
      });
      window.addEventListener("pagehide", () => stopCamera(false));

      render();
      drawIdleFrame();

      loadHandsScript()
        .then(() => {
          if (!window.Hands) throw new Error("hands-unavailable");
          state.hands = createDetector();
          state.libraryReady = true;
          state.statusKey = "standby";
          render();
          drawIdleFrame();
        })
        .catch((error) => {
          state.errorKey =
            error && error.message === "hands-unavailable"
              ? "handsUnavailable"
              : "handsLoad";
          state.statusKey = "moduleUnavailable";
          render();
          drawIdleFrame();
        });
    </script>
  </body>
</html>
